name: flutter_app
description: "Inhibit — Same social media. A better you."
publish_to: 'none'
version: 1.0.7+7

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_legacy.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_adaptive.png"

flutter:
  uses-material-design: true

  assets:
    - assets/engine/noscroll.js
    - assets/images/
    - assets/accesability/
    - assets/rules/facebook.json
    - assets/rules/instagram.json
    - assets/rules/linkedin.json
    - assets/rules/reddit.json
    - assets/rules/snapchat.json
    - assets/rules/tiktok.json
    - assets/rules/x.json
    - assets/rules/youtube.json
